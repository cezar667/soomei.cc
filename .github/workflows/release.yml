name: Release & Deploy

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: prod-deploy
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for release)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: release
    runs-on: ubuntu-latest
    env:
      PROD_PATH: ${{ secrets.PROD_PATH || '/opt/soomei' }}
    steps:
      - name: Checkout tag (for deploy)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
      
      - name: List workspace for debugging
        run: |
          echo "GITHUB_REF=${GITHUB_REF}"
          echo "Listing workspace root:"
          ls -la
          echo "Listing excluding .git/.github:"
          find . -maxdepth 2 -not -path "./.git/*" -not -path "./.github/*" -printf "%p\n" | head -n 200

      - name: Package application
        run: |
          git archive \
            --format=tar.gz \
            --output=release.tar.gz \
            "${GITHUB_SHA}"
          tar -tzf release.tar.gz > /dev/null

      - name: Upload to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          password: ${{ secrets.PROD_PASSWORD }}
          port: 22
          source: release.tar.gz
          target: ${{ env.PROD_PATH }}
          overwrite: true
          strip_components: 0

      - name: Restart services
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          password: ${{ secrets.PROD_PASSWORD }}
          port: 22
          script: |
            set -e
            cd "${{ env.PROD_PATH }}"
            tar -xzf release.tar.gz
            rm release.tar.gz
            systemctl restart soomei
            systemctl restart soomei-admin
            systemctl is-active --quiet soomei && echo "soomei ativo."
            systemctl is-active --quiet soomei-admin && echo "soomei-admin ativo."
            journalctl -u soomei -n 50 --no-pager || true
            journalctl -u soomei-admin -n 50 --no-pager || true
